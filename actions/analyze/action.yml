name: Analyze a Nuxt bundle
description: Check out a commit, install its dependencies, analyze its Nuxt app, and upload the run as the artifact `bundle-analyzer-<name>`.

inputs:
  name:
    description: Name of the run, such as `base` or `pr`, and of its artifact, `bundle-analyzer-<name>`.
    required: true
  ref:
    description: Commit to check out and analyze. Defaults to the commit of the event, the merge commit on `pull_request`.
    default: ''
  working-directory:
    description: Directory of the Nuxt app in the repository, for a monorepo.
    default: .
  node-version:
    description: Node.js version to install.
    default: lts/*
  install-command:
    description: Command that installs the dependencies, run where the lockfile is. Detected from the lockfile when empty.
    default: ''
  args:
    description: More options for `nuxt-bundle-analyzer`, such as `--prerender` or `--extends ./layer`.
    default: ''
  version:
    description: Version of `nuxt-bundle-analyzer` to run. Defaults to the version of this action's release.
    default: ''

outputs:
  artifact:
    description: Name of the uploaded artifact.
    value: bundle-analyzer-${{ inputs.name }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false

    - name: Find the lockfile
      id: project
      shell: bash
      env:
        APP_DIR: ${{ inputs.working-directory }}
        RUN_NAME: ${{ inputs.name }}
        VERSION: ${{ inputs.version }}
      run: |
        if [[ ! "$RUN_NAME" =~ ^[A-Za-z0-9_-]{1,64}$ ]]; then
          echo "::error::The run name can only have letters, digits, - and _."
          exit 1
        fi
        app=$(realpath "$APP_DIR")
        # In a monorepo the lockfile is in a parent of the app, up to the repository root.
        dir=$app
        manager=npm
        while :; do
          if [ -f "$dir/pnpm-lock.yaml" ]; then manager=pnpm; break; fi
          if [ -f "$dir/bun.lock" ] || [ -f "$dir/bun.lockb" ]; then manager=bun; break; fi
          if [ -f "$dir/yarn.lock" ]; then manager=yarn; break; fi
          if [ -f "$dir/package-lock.json" ]; then break; fi
          if [ "$dir" = "$GITHUB_WORKSPACE" ] || [ "$dir" = / ]; then dir=$app; break; fi
          dir=$(dirname "$dir")
        done
        # The release of this action runs the package of the same version.
        version=${VERSION:-$(node -p "require(process.env.GITHUB_ACTION_PATH + '/../../package.json').version")}
        {
          echo "app=$app"
          echo "root=$dir"
          echo "root-relative=$(realpath --relative-to="$GITHUB_WORKSPACE" "$dir")"
          echo "manager=$manager"
          echo "version=$version"
        } >> "$GITHUB_OUTPUT"

    - if: steps.project.outputs.manager == 'pnpm'
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: ${{ steps.project.outputs.root-relative }}/package.json
    - if: steps.project.outputs.manager == 'bun'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install the dependencies
      shell: bash
      working-directory: ${{ steps.project.outputs.root }}
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
        MANAGER: ${{ steps.project.outputs.manager }}
      run: |
        if [ -n "$INSTALL_COMMAND" ]; then
          eval "$INSTALL_COMMAND"
        elif [ "$MANAGER" = pnpm ]; then
          pnpm install --frozen-lockfile
        elif [ "$MANAGER" = bun ]; then
          bun install --frozen-lockfile
        elif [ "$MANAGER" = yarn ]; then
          # Yarn 2 and later need Corepack, which Node.js stopped shipping in version 25.
          if [ -f .yarnrc.yml ]; then
            npm install --global corepack
            corepack enable
            yarn install --immutable
          else
            yarn install --frozen-lockfile
          fi
        elif [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi

    # Run with npx, so the app needs no change to its dependencies or lockfile.
    - name: Analyze the bundle
      shell: bash
      working-directory: ${{ steps.project.outputs.app }}
      env:
        ARGS: ${{ inputs.args }}
        NUXT_TELEMETRY_DISABLED: '1'
        RUN_NAME: ${{ inputs.name }}
        VERSION: ${{ steps.project.outputs.version }}
      run: |
        # shellcheck disable=SC2086
        npx --yes "nuxt-bundle-analyzer@$VERSION" --name "$RUN_NAME" --no-serve $ARGS

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bundle-analyzer-${{ inputs.name }}
        path: ${{ steps.project.outputs.app }}/node_modules/.cache/nuxt-bundle-analyzer/${{ inputs.name }}
        if-no-files-found: error
        retention-days: 7
