name: Report a Nuxt bundle comparison
description: From a `workflow_run` workflow, upload the runs of a pull request to the hosted viewer and comment on the pull request with what changed.

inputs:
  viewer-url:
    description: Hosted viewer to upload the runs to, whose comparison leads the comment. Empty to only comment.
    default: https://bundle.nuxt.dev
  base:
    description: Name of the run to compare against, as given to the analyze action.
    default: base
  head:
    description: Name of the run with the change, as given to the analyze action.
    default: pr
  github-token:
    description: Token that posts the comment, such as a GitHub App's to comment as the app.
    default: ${{ github.token }}
  node-version:
    description: Node.js version to install.
    default: lts/*
  version:
    description: Version of `nuxt-bundle-analyzer` to run. Defaults to the version of this action's release.
    default: ''

outputs:
  pull-request:
    description: Number of the pull request commented on, empty when the run is skipped.
    value: ${{ steps.pull.outputs.number }}
  url:
    description: Comparison on the hosted viewer, empty when the upload is skipped or fails.
    value: ${{ steps.upload.outputs.url }}

runs:
  using: composite
  steps:
    # The runs come from a build of the pull request's code, so everything about them is checked
    # here, in a workflow that runs from the default branch.
    - name: Find the pull request and its runs
      id: pull
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
      with:
        script: |
          const run = context.payload.workflow_run
          if (context.eventName !== 'workflow_run' || !run) {
            core.setFailed('The report action runs in a workflow triggered by `workflow_run`.')
            return
          }
          if (run.event !== 'pull_request' || run.conclusion !== 'success') {
            core.info(`Skipping a ${run.conclusion} run of ${run.event}.`)
            return
          }
          if (!run.head_repository) {
            core.info('The pull request\'s repository no longer exists.')
            return
          }
          const names = [process.env.BASE, process.env.HEAD]
          if (!names.every(name => /^[\w-]{1,64}$/.test(name))) {
            core.setFailed('Run names can only have letters, digits, - and _.')
            return
          }

          // A fork's pull request is not in `run.pull_requests`, so it is found by its head branch.
          const pulls = await github.paginate(github.rest.pulls.list, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            head: `${run.head_repository.owner.login}:${run.head_branch}`,
            per_page: 100,
          })
          const pull = pulls.find(pull => pull.head.sha === run.head_sha
            && pull.head.repo?.id === run.head_repository.id
            && pull.base.repo.id === context.payload.repository.id)
          if (!pull) {
            core.info(`No open pull request has ${run.head_sha} as its head any more.`)
            return
          }

          const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: run.id,
            per_page: 100,
          })
          for (const [index, name] of names.entries()) {
            const matches = artifacts.filter(artifact => artifact.name === `bundle-analyzer-${name}` && !artifact.expired)
            if (matches.length !== 1 || matches[0].size_in_bytes > 64 * 1024 * 1024) {
              core.setFailed(`Expected one artifact bundle-analyzer-${name} of at most 64 MB from the triggering run.`)
              return
            }
            core.setOutput(index === 0 ? 'base-artifact' : 'head-artifact', String(matches[0].id))
          }
          core.setOutput('number', String(pull.number))
          core.setOutput('sha', run.head_sha)

    - if: steps.pull.outputs.number
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ steps.pull.outputs.base-artifact }}
        path: ${{ runner.temp }}/nuxt-bundle-analyzer/${{ inputs.base }}
        merge-multiple: true
        github-token: ${{ github.token }}
        run-id: ${{ github.event.workflow_run.id }}
    - if: steps.pull.outputs.number
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ steps.pull.outputs.head-artifact }}
        path: ${{ runner.temp }}/nuxt-bundle-analyzer/${{ inputs.head }}
        merge-multiple: true
        github-token: ${{ github.token }}
        run-id: ${{ github.event.workflow_run.id }}

    - if: steps.pull.outputs.number
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
    - if: steps.pull.outputs.number
      id: version
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: echo "version=${VERSION:-$(node -p "require(process.env.GITHUB_ACTION_PATH + '/../../package.json').version")}" >> "$GITHUB_OUTPUT"

    # The viewer checks this workflow's OpenID Connect token and every file before storing the runs.
    # The comment is still posted without the link when the upload fails.
    - if: steps.pull.outputs.number && inputs.viewer-url
      id: upload
      continue-on-error: true
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        PR_NUMBER: ${{ steps.pull.outputs.number }}
        SHA: ${{ steps.pull.outputs.sha }}
        VERSION: ${{ steps.version.outputs.version }}
        VIEWER_URL: ${{ inputs.viewer-url }}
      run: >-
        npx --yes "nuxt-bundle-analyzer@$VERSION" upload
        --runs "$RUNNER_TEMP/nuxt-bundle-analyzer"
        --base "$BASE"
        --head "$HEAD"
        --pr "$PR_NUMBER"
        --sha "$SHA"
        --url "$VIEWER_URL"

    - if: steps.pull.outputs.number
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        BASE: ${{ inputs.base }}
        HEAD: ${{ inputs.head }}
        LINK: ${{ steps.upload.outputs.url }}
        SHA: ${{ steps.pull.outputs.sha }}
        VERSION: ${{ steps.version.outputs.version }}
      run: >-
        npx --yes "nuxt-bundle-analyzer@$VERSION" comment
        --runs "$RUNNER_TEMP/nuxt-bundle-analyzer"
        --base "$BASE"
        --head "$HEAD"
        --sha "$SHA"
        ${LINK:+--link "$LINK"}
        --output "$RUNNER_TEMP/nuxt-bundle-analyzer-comment.md"

    - if: steps.pull.outputs.number
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        COMMENT_PATH: ${{ runner.temp }}/nuxt-bundle-analyzer-comment.md
        PR_NUMBER: ${{ steps.pull.outputs.number }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('node:fs')
          const marker = '<!-- nuxt-bundle-analyzer -->'
          const body = fs.readFileSync(process.env.COMMENT_PATH, 'utf8')
          const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: Number(process.env.PR_NUMBER) }
          await core.summary.addRaw(body).write()
          try {
            const comments = await github.paginate(github.rest.issues.listComments, { ...issue, per_page: 100 })
            const previous = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.startsWith(marker))
            if (previous) {
              await github.rest.issues.updateComment({ ...issue, comment_id: previous.id, body })
            }
            else {
              await github.rest.issues.createComment({ ...issue, body })
            }
          }
          catch (error) {
            core.warning(`Could not comment on the pull request, so the report is only in the run summary: ${error.message}`)
          }
