name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Installs the pnpm version `packageManager` pins, Node.js, and the dependencies from the lockfile.
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  analyze:
    name: analyze the playground
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm build
      # Builds a real Nuxt app with the command, which is what the unit tests cannot cover.
      - name: Analyze the playground
        working-directory: playground
        # The layer prerenders /chart and /stats only, which `--prerender` records.
        run: node ../dist/cli.mjs --name=ci --no-serve --prerender --extends ./prerender-layer
      - name: Check the run has every report
        working-directory: playground
        run: |
          for file in client.json nitro.json nuxt.json meta.json; do
            test -s "node_modules/.cache/nuxt-bundle-analyzer/ci/$file" || { echo "::error::The run has no $file."; exit 1; }
          done
          node -e "const data = require('./node_modules/.cache/nuxt-bundle-analyzer/ci/nuxt.json'); if (!data.routes.length) { console.error('::error::nuxt.json lists no routes.'); process.exit(1) }"
      # /chart renders the lazy HeavyChart on the server, so its HTML preloads the chunk its route's static imports don't reach.
      - name: Check the prerendered pages
        working-directory: playground
        run: |
          node -e "
            const data = require('./node_modules/.cache/nuxt-bundle-analyzer/ci/nuxt.json')
            const urls = (data.prerendered ?? []).map(page => page.url).sort()
            if (urls.join() !== '/chart,/stats') { console.error('::error::nuxt.json lists the prerendered pages ' + JSON.stringify(urls) + ', not /chart and /stats.'); process.exit(1) }
            const chart = Object.keys(data.chunks).find(file => data.chunks[file].src?.endsWith('HeavyChart.vue'))
            const files = url => data.prerendered.find(page => page.url === url).files
            if (!chart || !files('/chart').includes(chart) || files('/stats').includes(chart)) { console.error('::error::The HeavyChart chunk should be in the files of /chart only.'); process.exit(1) }
          "
